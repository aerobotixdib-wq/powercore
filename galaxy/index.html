<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Galaxy Hands</title>
<style>
  :root { --fg:#e8f0ff; --accent:#7cf; --bg:#000; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; touch-action:none; }
  canvas#gl { position:fixed; inset:0; width:100%; height:100%; display:block; }
  video { position:fixed; right:12px; bottom:12px; width:96px; height:128px; object-fit:cover;
    border-radius:12px; opacity:.35; transform:scaleX(-1); border:1px solid #fff3; z-index:2; }
  #hud { position:fixed; top:14px; left:16px; right:16px; z-index:3; pointer-events:none;
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  #title { font-weight:800; letter-spacing:.25em; font-size:12px; text-transform:uppercase;
    background:linear-gradient(90deg,#7cf,#c8f,#f8a); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #mode { font-size:12px; padding:6px 10px; border-radius:999px; background:#ffffff12; border:1px solid #ffffff22;
    backdrop-filter:blur(6px); letter-spacing:.08em; }
  #start { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; background:radial-gradient(circle at 50% 40%, #1a1040 0%, #000 70%); text-align:center; padding:16px; }
  #start h1 { font-size:clamp(28px,8vw,54px); font-weight:900; letter-spacing:.06em;
    background:linear-gradient(90deg,#7cf,#c8f,#f8a); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #start p { max-width:340px; opacity:.75; line-height:1.6; font-size:14px; }
  #start button { font-size:16px; font-weight:700; padding:14px 34px; border-radius:999px; border:0; cursor:pointer;
    color:#000; background:linear-gradient(90deg,#7cf,#c8f); box-shadow:0 0 30px #7cf8; }
  #legend { font-size:12px; opacity:.6; line-height:1.9; }
  #err { color:#f88; font-size:13px; max-width:340px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<video id="cam" playsinline muted></video>
<div id="hud"><div id="title">Galaxy Hands</div><div id="mode">IDLE</div></div>
<div id="start">
  <h1>GALAXY HANDS</h1>
  <p>20,000 stars that obey your hands. Allow the camera and hold your hand up.</p>
  <div id="legend">✋ Open palm: gravity well<br>✊ Fist: supernova blast<br>🤏 Pinch: vortex spin<br>🙌 Two hands: lightning arc</div>
  <button id="go">START</button>
  <div id="err"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
const N = isMobile ? 14000 : 20000;

// ---------- Renderer / scene ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 14);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.25, 0.6, 0.0);
composer.addPass(bloom);

// ---------- Particles ----------
const pos = new Float32Array(N*3), vel = new Float32Array(N*3), home = new Float32Array(N*3);
const col = new Float32Array(N*3), base = new Float32Array(N*3), size = new Float32Array(N);
const c = new THREE.Color();
for (let i=0;i<N;i++){
  const arms = 4, arm = i % arms;
  const r = Math.pow(Math.random(), 0.7) * 7.5;
  const a = arm/arms*Math.PI*2 + r*0.55 + (Math.random()-0.5)*0.5;
  const spread = 0.35 * (1 - r/9);
  const x = Math.cos(a)*r + (Math.random()-0.5)*spread*2;
  const y = (Math.random()-0.5) * 0.6 * Math.exp(-r*0.3);
  const z = Math.sin(a)*r + (Math.random()-0.5)*spread*2;
  home[i*3]=x; home[i*3+1]=y; home[i*3+2]=z;
  pos[i*3]=(Math.random()-0.5)*40; pos[i*3+1]=(Math.random()-0.5)*40; pos[i*3+2]=(Math.random()-0.5)*40;
  c.setHSL(0.58 + r/7.5*0.35 + Math.random()*0.05, 0.85, r < 1 ? 0.85 : 0.55);
  base[i*3]=c.r; base[i*3+1]=c.g; base[i*3+2]=c.b;
  col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  size[i] = Math.random()*1.6 + 0.4;
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
geo.setAttribute('color', new THREE.BufferAttribute(col,3));
geo.setAttribute('size', new THREE.BufferAttribute(size,1));
const mat = new THREE.ShaderMaterial({
  uniforms:{ uScale:{ value: renderer.getPixelRatio() * 38 } },
  vertexShader:`
    attribute float size; varying vec3 vC; uniform float uScale;
    void main(){ vC = color; vec4 mv = modelViewMatrix*vec4(position,1.);
      gl_PointSize = size * uScale / -mv.z; gl_Position = projectionMatrix*mv; }`,
  fragmentShader:`
    varying vec3 vC;
    void main(){ float d = length(gl_PointCoord-.5); if(d>.5) discard;
      float a = pow(1.-d*2., 2.2); gl_FragColor = vec4(vC*a*1.6, a); }`,
  vertexColors:true, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
});
const points = new THREE.Points(geo, mat);
const galaxy = new THREE.Group(); galaxy.add(points); galaxy.rotation.x = 0.9; scene.add(galaxy);

// background stars
{
  const g = new THREE.BufferGeometry(), M = 1500, p = new Float32Array(M*3);
  for (let i=0;i<M*3;i++) p[i]=(Math.random()-0.5)*120;
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size:0.08, color:0x8899ff, transparent:true, opacity:.6 })));
}

// ---------- Hand cursors + lightning ----------
function makeCursor(color){
  const m = new THREE.Mesh(new THREE.RingGeometry(0.35,0.45,48),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0, blending:THREE.AdditiveBlending, side:THREE.DoubleSide }));
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.14,16,16),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0, blending:THREE.AdditiveBlending }));
  m.add(core); scene.add(m); return m;
}
const cursors = [makeCursor(0x77ccff), makeCursor(0xff88cc)];
const BOLTS = 3, SEG = 28;
const bolts = [];
for (let b=0;b<BOLTS;b++){
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SEG*3),3));
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: b?0xaa88ff:0xeeffff, transparent:true, opacity:0, blending:THREE.AdditiveBlending }));
  scene.add(l); bolts.push(l);
}

// ---------- Hand tracking ----------
const video = document.getElementById('cam');
const modeEl = document.getElementById('mode');
let landmarker = null, lastVideoTime = -1;
const hands = []; // {world:Vector3, gesture, strength}

const d2 = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y, (a.z-b.z));
function classify(lm){
  const wrist = lm[0], palm = d2(lm[0], lm[9]) || 1e-3;
  const tips=[8,12,16,20], pips=[6,10,14,18];
  let ext=0; for (let k=0;k<4;k++) if (d2(lm[tips[k]],wrist) > d2(lm[pips[k]],wrist)*1.15) ext++;
  const pinch = d2(lm[4], lm[8]) / palm;
  if (pinch < 0.35 && ext <= 3) return 'pinch';
  if (ext <= 1) return 'fist';
  if (ext >= 3) return 'open';
  return 'none';
}
const tmpV = new THREE.Vector3();
function toWorld(nx, ny, target){
  // mirror x, project onto z=0 plane
  tmpV.set((1-nx)*2-1, -(ny*2-1), 0.5).unproject(camera).sub(camera.position).normalize();
  const t = -camera.position.z / tmpV.z;
  target.copy(camera.position).addScaledVector(tmpV, t);
}

async function startTracking(){
  const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:640}, height:{ideal:480} }, audio:false });
  video.srcObject = stream; await video.play();
  const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts = (delegate)=>({ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate },
    runningMode:'VIDEO', numHands:2, minHandDetectionConfidence:0.5, minTrackingConfidence:0.5 });
  try { landmarker = await HandLandmarker.createFromOptions(fileset, opts('GPU')); }
  catch { landmarker = await HandLandmarker.createFromOptions(fileset, opts('CPU')); }
}
function track(){
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = landmarker.detectForVideo(video, performance.now());
  const lms = res.landmarks || [];
  for (let h=0;h<2;h++){
    if (h < lms.length){
      const lm = lms[h];
      if (!hands[h]) hands[h] = { world:new THREE.Vector3(), target:new THREE.Vector3(), gesture:'none', seen:0 };
      toWorld(lm[9].x, lm[9].y, hands[h].target);
      if (!hands[h].seen) hands[h].world.copy(hands[h].target);
      hands[h].gesture = classify(lm); hands[h].seen = 1;
    } else if (hands[h]) hands[h].seen = 0;
  }
}

// ---------- Simulation ----------
const inv = new THREE.Matrix4(), local = [new THREE.Vector3(), new THREE.Vector3()];
let shock = 0, t0 = performance.now();
function step(dt, time){
  const active = hands.filter(h=>h && h.seen);
  for (const h of active) h.world.lerp(h.target, 0.45);
  const two = active.length === 2;
  galaxy.updateMatrixWorld(); inv.copy(galaxy.matrixWorld).invert();
  active.forEach((h,k)=> local[k].copy(h.world).applyMatrix4(inv));

  let label = 'IDLE · GALAXY';
  if (two) label = '⚡ LIGHTNING ARC';
  else if (active[0]) label = { open:'✋ GRAVITY WELL', fist:'✊ SUPERNOVA', pinch:'🤏 VORTEX', none:'· TRACKING' }[active[0].gesture];
  modeEl.textContent = label;

  if (active.some(h=>h.gesture==='fist')) shock = Math.min(1, shock + dt*4); else shock = Math.max(0, shock - dt*2);

  const k = Math.min(dt*60, 2.5);
  for (let i=0;i<N;i++){
    const ix=i*3; let px=pos[ix], py=pos[ix+1], pz=pos[ix+2];
    let vx=vel[ix], vy=vel[ix+1], vz=vel[ix+2];
    // spring home + orbital drift
    vx += (home[ix]-px)*0.0025*k; vy += (home[ix+1]-py)*0.0025*k; vz += (home[ix+2]-pz)*0.0025*k;
    const r = Math.hypot(home[ix], home[ix+2]) + 0.5;
    vx += -home[ix+2]/r*0.0018*k; vz += home[ix]/r*0.0018*k;
    let heat = 0;
    for (let h=0;h<active.length;h++){
      const g = two ? 'arc' : active[h].gesture, L = local[h];
      const dx=L.x-px, dy=L.y-py, dz=L.z-pz, dsq=dx*dx+dy*dy+dz*dz+0.3, d=Math.sqrt(dsq);
      if (g==='open'){ const f=Math.min(0.9/dsq, 0.25)*k; vx+=dx/d*f; vy+=dy/d*f; vz+=dz/d*f; heat=Math.max(heat, 1/(1+d)); }
      else if (g==='fist'){ const f=Math.min(4.5/dsq, 1.2)*shock*k; vx-=dx/d*f; vy-=dy/d*f; vz-=dz/d*f; heat=Math.max(heat, shock*1.5/(1+d*0.5)); }
      else if (g==='pinch'){ const f=Math.min(1.6/d, 0.6)*0.06*k; vx+=(-dz)/d*f*3 + dx/d*f*0.4; vz+=(dx)/d*f*3 + dz/d*f*0.4; vy+=dy/d*f*0.5; heat=Math.max(heat, 0.8/(1+d)); }
      else if (g==='arc'){ // pull toward segment between hands
        const A=local[0], B=local[1], abx=B.x-A.x, aby=B.y-A.y, abz=B.z-A.z, ab2=abx*abx+aby*aby+abz*abz+1e-4;
        let s=((px-A.x)*abx+(py-A.y)*aby+(pz-A.z)*abz)/ab2; s=Math.max(0,Math.min(1,s));
        const qx=A.x+abx*s-px, qy=A.y+aby*s-py, qz=A.z+abz*s-pz, qd=Math.hypot(qx,qy,qz)+0.2;
        const f=Math.min(0.5/(qd*qd),0.18)*k*0.5; vx+=qx/qd*f; vy+=qy/qd*f; vz+=qz/qd*f;
        heat=Math.max(heat, 1.2/(1+qd*2)); break;
      }
    }
    const damp = Math.pow(0.94, k); vx*=damp; vy*=damp; vz*=damp;
    pos[ix]=px+vx*k; pos[ix+1]=py+vy*k; pos[ix+2]=pz+vz*k; vel[ix]=vx; vel[ix+1]=vy; vel[ix+2]=vz;
    const sp = Math.min(Math.hypot(vx,vy,vz)*6, 1), w = Math.min(heat + sp*0.6, 1);
    col[ix]  = base[ix]*(1-w) + (two?0.8:1.0)*w;
    col[ix+1]= base[ix+1]*(1-w) + (two?0.9:0.75)*w;
    col[ix+2]= base[ix+2]*(1-w) + 1.0*w;
  }
  geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true;

  // cursors
  for (let h=0;h<2;h++){
    const cur = cursors[h], on = hands[h] && hands[h].seen;
    cur.material.opacity += ((on?0.9:0) - cur.material.opacity)*0.2; cur.children[0].material.opacity = cur.material.opacity;
    if (on){ cur.position.copy(hands[h].world); const g=hands[h].gesture;
      cur.scale.setScalar(g==='fist'?0.6+shock*1.5 : g==='pinch'?0.7 : 1+Math.sin(time*6)*0.08); cur.rotation.z += dt*(g==='pinch'?8:1.5); }
  }
  // lightning
  bolts.forEach((l,b)=>{
    l.material.opacity += ((two?(b?0.6:1):0) - l.material.opacity)*0.3;
    if (!two) return;
    const A=hands[0].world, B=hands[1].world, arr=l.geometry.attributes.position.array, len=A.distanceTo(B);
    for (let s=0;s<SEG;s++){
      const u=s/(SEG-1), env=Math.sin(u*Math.PI)*len*0.12*(b?1.6:1);
      arr[s*3]  =A.x+(B.x-A.x)*u+(Math.random()-0.5)*env;
      arr[s*3+1]=A.y+(B.y-A.y)*u+(Math.random()-0.5)*env;
      arr[s*3+2]=A.z+(B.z-A.z)*u+(Math.random()-0.5)*env;
    }
    l.geometry.attributes.position.needsUpdate = true;
  });
  bloom.strength = 1.1 + shock*1.2 + (two?0.6:0);
}

// ---------- Loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  track(); step(dt, (now-t0)/1000);
  galaxy.rotation.y += dt*0.05;
  camera.position.x = Math.sin(now*0.0001)*1.2; camera.lookAt(0,0,0);
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

document.getElementById('go').onclick = async ()=>{
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.textContent = 'LOADING…'; btn.disabled = true;
  try { await startTracking(); document.getElementById('start').style.display='none'; }
  catch(e){ err.textContent = 'Camera/model failed: ' + (e.message||e) + ' — open over HTTPS and allow camera.'; btn.textContent='RETRY'; btn.disabled=false; }
};
</script>
</body>
</html>
