<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const KEY='moneyBuckets.v1';
const defaults=[
  ['Grocery',8000,5200],['Payments to people',5000,3000],['Loan EMI',9500,9500],
  ['Eating out / Online food',3000,2850],['Bills & Recharge',2500,1400],['Online shopping',2000,2350],
  ['Travel',2000,600],['Misc',1500,700],['Savings',6500,0]
].map(([name,planned,spent])=>({name,planned,spent}));
let state={start:'2026-11-07',cash:1200,buckets:defaults,unassigned:0,example:true,history:[]};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.buckets))state=s;}catch(e){}
if(state.example===undefined)state.example=true;
state.unassigned=state.unassigned||0;state.history=state.history||[];
state.cycId=state.cycId||state.start;
state.merchants=state.merchants||{};state.pending=state.pending||null;
if(state.example&&!state.history.length){
  const mkb=sp=>defaults.map((b,k)=>({name:b.name,planned:b.planned,spent:sp[k]}));
  state.history=[
    {start:'2026-08-07',end:'2026-09-07',income:40000,untracked:400,unassigned:0,ex:true,buckets:mkb([7400,4200,9500,4100,2300,2600,1200,1300,0])},
    {start:'2026-09-07',end:'2026-10-07',income:40000,untracked:250,unassigned:0,ex:true,buckets:mkb([7900,5000,9500,3600,2450,1800,2600,1700,0])},
    {start:'2026-10-07',end:'2026-11-07',income:40000,untracked:600,unassigned:0,ex:true,buckets:mkb([8300,4600,9500,3300,2380,2500,900,1100,0])}];
}
if(!state.txns)state.txns=state.example?[
  {id:'tx3',date:'2026-11-18',amt:640,bucket:'Grocery',name:'Das Grocery',ex:true},
  {id:'tx2',date:'2026-11-17',amt:420,bucket:'Eating out / Online food',name:'Zomato',ex:true},
  {id:'tx1',date:'2026-11-15',amt:349,bucket:'Bills & Recharge',name:'Jio recharge',ex:true}]:[];
if(!state.goals)state.goals=state.example?[
  {id:'g1',name:'School fees',target:15000,saved:9000,kept:'With me',ex:true},
  {id:'g2',name:'Car tyres & service',target:24000,saved:6000,kept:'RD',ex:true},
  {id:'g3',name:'Medical',target:null,saved:4500,kept:'Bank',ex:true},
  {id:'g4',name:'Wedding',target:null,saved:30000,kept:'SIP / ETF',ex:true}]:[];
if(!state.loans)state.loans=state.example?[
  {id:'l1',name:'Car loan',kind:'EMI',amount:9500,paidCycle:'2026-11-07',paidAmt:9500,ex:true},
  {id:'l2',name:'Credit card',kind:'Credit card bill',amount:null,ex:true}]:[];
state.loans=state.loans.filter(l=>!l.fromSalary).map(l=>l.kind==='Interest'?{...l,kind:'Monthly interest'}:l).map(l=>l.kind?l:{id:l.id,name:l.name,
  kind:l.type==='card'?'Credit card bill':l.type==='emi'?'EMI':'Monthly interest',amount:l.emi||null,paidCycle:l.paidCycle,paidAmt:l.paidAmt,ex:l.ex});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const toNum=v=>Number(String(v).replace(/[^\d]/g,''))||0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const $=id=>document.getElementById(id);
const svg=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const ICONS={
  'Grocery':'M3 9h18l-2 10a2 2 0 0 1-2 1.6H7A2 2 0 0 1 5 19L3 9zM8 9l4-5 4 5M9 13v4M15 13v4',
  'Payments to people':'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
  'Loan EMI':'M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18',
  'Eating out / Online food':'M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1-3 4-3 7h3',
  'Bills & Recharge':'M13 2L4 14h7l-1 8 9-12h-7l1-8z',
  'Online shopping':'M5 8h14l-1 13H6L5 8zM9 8V6a3 3 0 0 1 6 0v2',
  'Travel':'M6 17V6a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v11zM6 12h12M8 21v-4M16 21v-4M9 15h.01M15 15h.01',
  'Misc':'M5 12h.01M12 12h.01M19 12h.01',
  'Savings':'M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4zM9 12l2 2 4-4'
};


/* Colourful bucket icons */
const BICON={'Grocery':['shopping_basket','#2E9D57'],'Payments to people':['groups','#2F6FE4'],'Loan EMI':['account_balance','#5B5BD6'],
  'Eating out / Online food':['restaurant','#EF7A1A'],'Bills & Recharge':['bolt','#D99A00'],'Online shopping':['shopping_bag','#DB3F76'],
  'Travel':['directions_bus','#1797D2'],'Misc':['category','#7B68B5'],'Savings':['savings','#00897B']};
const BKEY=[[/medic|health|doctor|hospital|pharma/i,'medical_services','#E0484A'],[/school|fee|tuition|educat|college|book/i,'school','#7A4FD8'],
  [/rent|house|home|flat/i,'home','#C2703D'],[/fuel|petrol|diesel|gas/i,'local_gas_station','#5E7383'],[/phone|mobile|recharge|wifi|internet/i,'smartphone','#3B82F6'],
  [/kid|child|baby|son|daughter/i,'child_care','#E26AA8'],[/pet|dog|cat/i,'pets','#A0702F'],[/gift|festival|puja|bihu|wedding/i,'redeem','#D9468F'],
  [/food|eat|restaurant|swiggy|zomato/i,'restaurant','#EF7A1A'],[/travel|trip|bus|cab|train/i,'directions_bus','#1797D2'],[/saving/i,'savings','#00897B']];
function bIcon(name){
  if(BICON[name])return{i:BICON[name][0],c:BICON[name][1]};
  for(const [re,i,c] of BKEY)if(re.test(name))return{i,c};
  return{i:'category',c:'#64748B'};
}
function paintIcon(el,name){
  const b=bIcon(name||'');el.innerHTML='';const g=document.createElement('span');g.className='ms';g.textContent=b.i;el.append(g);
  el.style.color=b.c;el.style.background='color-mix(in srgb, '+b.c+' 14%, var(--surface))';
}
function render(){
  const planned=state.buckets.reduce((a,b)=>a+b.planned,0);
  const spent=state.buckets.reduce((a,b)=>a+b.spent,0);
  const day=Math.max(1,Math.floor((Date.now()-new Date(state.start+'T00:00'))/864e5)+1);
  const total=planned+state.unassigned;
  $('exNote').hidden=true;
  $('cycle').textContent='Day '+day+' of cycle';
  $('cycleLine').textContent='Cycle started '+fmtDate(state.start);
  $('bCount').textContent=state.buckets.length+' active';
  const ut=state.untracked||0;
  $('leftAll').textContent=inr(total-spent-ut);
  $('ofAll').textContent='left of '+inr(total);
  $('pctAvail').textContent=(total?Math.max(0,Math.round(100*(total-spent-ut)/total)):0)+'% available';
  $('barAll').style.width=(total?Math.max(0,100*(total-spent-ut)/total):0)+'%';
  $('cash').textContent=inr(state.cash);
  $('unas').textContent=state.unassigned>0?'Unassigned '+inr(state.unassigned):'';
  const sb=state.buckets.find(x=>x.name==='Savings');
  $('spentAll').textContent=inr(spent-(sb?sb.spent:0)+ut)+' spent';
  const g=$('grid');g.innerHTML='';
  state.buckets.forEach(b=>{
    const left=b.planned-b.spent, used=b.planned?b.spent/b.planned:0;
    const sv=b.name==='Savings',ln=b.name==='Loan EMI';
    const el=document.createElement('article');
    el.className='b tap'+(sv?'':left<0?' over':used>=.85?' warn':'');
    el.innerHTML=`<div class="ring"><span class="ic"></span></div><span class="name"></span><span class="left num"></span><span class="pct num"></span>`;
    el.querySelector('.ring').style.setProperty('--p',sv?0:Math.min(100,used*100));
    if(sv||ln){
      const bd=document.createElement('span');bd.className='badge';bd.innerHTML=svg('M9 6l6 6-6 6');el.querySelector('.ring').appendChild(bd);
      el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','Open '+(sv?'savings goals':'loans'));
      el.onclick=()=>openSub(sv?'sav':'loan');
      el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSub(sv?'sav':'loan')}};
    }else{
      el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','Open '+b.name);
      el.onclick=()=>openSub('b:'+b.name);
      el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSub('b:'+b.name)}};
    }
    const ic=el.querySelector('.ic');
    paintIcon(ic,b.name);
    el.querySelector('.left').textContent=left<0?'−'+inr(-left):inr(left)+' left';
    el.style.setProperty('--bc',bIcon(b.name).c);
    const oc=cardIn(b.name);
    el.querySelector('.pct').textContent=oc&&!sv&&!ln?'+'+inr(oc)+' on card':sv?'Tap for goals':left<0?'Over budget':ln?'Tap for loans':b.planned?Math.round(used*100)+'% used':'Not planned';
    el.querySelector('.name').textContent=b.name;
    el.title=b.planned?inr(b.spent)+' spent of '+inr(b.planned):'Not planned yet';
    g.appendChild(el);
  });
  const add=document.createElement('button');add.className='b add';
  add.innerHTML=`<div class="ring"><span class="ic">${svg('M12 5v14M5 12h14')}</span></div><span class="name">Add bucket</span><span class="pct">Make your own</span>`;
  add.onclick=openSheet;g.appendChild(add);
  renderExtras();
}
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());if(/taken from|on .*bill|added|saved|applied|paid|recorded|cleared|created/i.test(t)){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function openSheet(){$('err').textContent='';$('bName').value='';$('sheet').hidden=false;$('bName').focus()}
$('cancel').onclick=()=>$('sheet').hidden=true;
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').hidden=true};
$('addForm').onsubmit=e=>{
  e.preventDefault();const n=$('bName').value.trim();
  if(!n){$('err').textContent='Type a name for the bucket.';return}
  if(state.buckets.some(b=>b.name.toLowerCase()===n.toLowerCase())){$('err').textContent='A bucket with this name already exists.';return}
  state.buckets.splice(state.buckets.length-1,0,{name:n,planned:0,spent:0});
  save();render();$('sheet').hidden=true;toast('Bucket added');
};
$('cashBtn').onclick=()=>openSub('cash');

/* Add income */
let inc;
const isSav=b=>b.name==='Savings';
function carryAmount(){
  if(state.example)return 0;
  return Math.max(0,state.unassigned+state.buckets.filter(b=>!isSav(b)).reduce((a,b)=>a+b.planned-b.spent,0));
}
function setType(t){inc.type=t;$('optNew').setAttribute('aria-pressed',t==='new');$('optExtra').setAttribute('aria-pressed',t==='extra')}
function openIncome(){
  inc={type:'new',amount:0,alloc:{},step:1};setType('new');
  $('incAmt').value='';$('incErr').textContent='';
  $('step1').hidden=false;$('step2').hidden=true;
  $('incTitle').textContent='Add income';$('incNext').textContent='Next';$('incNext').disabled=false;$('counter').innerHTML='';
  $('incPage').hidden=false;$('incAmt').focus();
}
function closeIncome(){$('incPage').hidden=true}
function updateCounter(){
  const used=Object.values(inc.alloc).reduce((a,v)=>a+v,0),left=inc.amount-used,c=$('counter');
  c.className='counter num'+(left<0?' over':left===0?' done':'');
  c.innerHTML=left<0?'Over by <b>'+inr(-left)+'</b>':left===0?'All assigned <b>₹0 left</b>':'Left to assign <b>'+inr(left)+'</b>';
  $('incNext').disabled=left<0;
}
function renderAlloc(){
  const l=$('alist');l.innerHTML='';
  state.buckets.forEach((b,i)=>{
    const r=document.createElement('div');r.className='arow';
    r.innerHTML=`<span class="mini"></span><span class="nm"><span></span><small></small></span><input inputmode="numeric" placeholder="₹0" autocomplete="off">`;
    const m=r.querySelector('.mini');paintIcon(m,b.name);
    r.querySelector('.nm span').textContent=b.name;
    let sm=inc.type==='extra'?'Now '+inr(b.planned-b.spent)+' left':(state.example?'':'Last cycle '+inr(b.planned));
    if(b.name==='Loan EMI'&&emiTotal())sm=(sm?sm+' · ':'')+'Your loans need '+inr(emiTotal());
    r.querySelector('small').textContent=sm;
    const input=r.querySelector('input');input.id='alloc'+i;input.setAttribute('aria-label',b.name+' amount');
    if(inc.alloc[b.name])input.value=inc.alloc[b.name].toLocaleString('en-IN');
    input.oninput=()=>{inc.alloc[b.name]=toNum(input.value);updateCounter()};
    input.onblur=()=>{const v=toNum(input.value);input.value=v?v.toLocaleString('en-IN'):''};
    l.appendChild(r);
  });
  updateCounter();
}
$('optNew').onclick=()=>setType('new');
$('optExtra').onclick=()=>setType('extra');
$('incAmt').onblur=()=>{const v=toNum($('incAmt').value);$('incAmt').value=v?'₹'+v.toLocaleString('en-IN'):''};
$('incBack').onclick=()=>{if(inc.step===2){inc.step=1;$('step1').hidden=false;$('step2').hidden=true;$('incNext').textContent='Next';$('incNext').disabled=false;$('counter').innerHTML='';$('incTitle').textContent='Add income'}else closeIncome()};
$('useLast').onclick=()=>{state.buckets.forEach(b=>{inc.alloc[b.name]=b.planned});renderAlloc();toast('Filled from last cycle. Change any amount.')};
$('incNext').onclick=()=>{
  if(inc.step===1){
    inc.amount=toNum($('incAmt').value);
    if(!inc.amount){$('incErr').textContent='Type the amount you received.';return}
    inc.step=2;inc.alloc={};
    $('step1').hidden=true;$('step2').hidden=false;
    $('incTitle').textContent=(inc.type==='new'?'Plan ':'Add ')+inr(inc.amount);
    const carry=carryAmount();
    $('incInfo').textContent=inc.type==='new'
      ?'Fill how much goes into each bucket this cycle.'+(carry?' '+inr(carry)+' left over from the current cycle will move to Savings.':'')
      :'Add this extra money to any buckets. Anything you leave stays unassigned.';
    $('useLast').hidden=inc.type!=='new';$('useSug').hidden=inc.type!=='new'||!state.history.length;
    $('incNext').textContent='Save';
    if(inc.type==='new'&&state.autoPlan){const sp=suggestPlan(inc.amount);if(sp)state.buckets.forEach(b=>{inc.alloc[b.name]=sp.plan[b.name]||0})}
    if(inc.type==='new'&&cardDueAll()&&!inc.alloc['Loan EMI'])inc.alloc['Loan EMI']=emiTotal();
    renderAlloc();if(inc.type==='new'&&state.autoPlan&&state.history.length)toast('Suggested plan filled in. Change any amount.');return;
  }
  const used=Object.values(inc.alloc).reduce((a,v)=>a+v,0),left=inc.amount-used;
  if(left<0)return;
  if(inc.type==='new'){
    const carry=carryAmount();
    const sav=state.buckets.find(isSav),savLeft=(!state.example&&sav)?Math.max(0,sav.planned-sav.spent):0;
    if(!state.example&&(state.income||state.buckets.some(b=>b.planned||b.spent)))state.history.push({start:state.start,end:today(),buckets:state.buckets.map(b=>({...b})),unassigned:state.unassigned,income:state.income,untracked:state.untracked||0});
    state.buckets=state.buckets.map(b=>({name:b.name,planned:(inc.alloc[b.name]||0)+(isSav(b)?savLeft+carry:0),spent:0}));
    if(state.example){state.goals=state.goals.filter(g=>!g.ex);state.loans=state.loans.filter(l=>!l.ex);state.txns=state.txns.filter(t=>!t.ex);state.history=state.history.filter(h=>!h.ex)}
    const dues=state.loans.filter(isCard).map(l=>[l,nextBill(l)]);
    state.start=today();state.unassigned=left;state.example=false;state.untracked=0;state.income=inc.amount;state.cycId='c'+Date.now();
    {const lb=loanBucket();let room=lb?lb.planned:0;
     dues.forEach(([l,d])=>{l.billDue=d;const a=Math.min(d,room);if(a>0&&lb){lb.spent+=a;room-=a;l.paidAmt=a;l.paidCycle=state.cycId}});}
    save();render();closeIncome();toast(carry?'New cycle started. '+inr(carry)+' moved to Savings':'New cycle started');
    if(state.history.length)setTimeout(()=>openSub('an:'+(state.history.length-1)),500);
  }else{
    state.income=incomeOf(cyc(-1))+inc.amount;
    state.buckets.forEach(b=>{b.planned+=inc.alloc[b.name]||0});
    state.unassigned+=left;
    save();render();closeIncome();toast('Extra income added');
  }
};
$('incomeBtn').onclick=openIncome;

/* Move money between buckets */
$('moveBtn').onclick=()=>{
  const opts=state.buckets.map(b=>({v:b.name,t:b.name+' · '+inr(b.planned-b.spent)}));
  const from=state.unassigned>0?[{v:'__u',t:'Unassigned · '+inr(state.unassigned)},...opts]:opts;
  openForm({title:'Move money',sub:'This only changes your plan. Nothing is counted as spent.',ok:'Move',
    fields:[{id:'amt',type:'money',label:'Amount'},
      {id:'from',type:'chips',label:'From',options:from},
      {id:'to',type:'chips',label:'To',options:state.buckets.map(b=>({v:b.name,t:b.name}))}],
    onSubmit:v=>{
      if(!v.amt)return 'Type an amount.';
      if(!v.from)return 'Choose the bucket to move from.';
      if(!v.to)return 'Choose the bucket to move to.';
      if(v.from===v.to)return 'Choose two different buckets.';
      const src=v.from==='__u'?null:state.buckets.find(b=>b.name===v.from),dst=state.buckets.find(b=>b.name===v.to);
      const avail=src?src.planned-src.spent:state.unassigned;
      if(v.amt>avail)return (src?v.from:'Unassigned')+' has only '+inr(Math.max(0,avail))+' left.';
      if(src)src.planned-=v.amt;else state.unassigned-=v.amt;
      dst.planned+=v.amt;
      done(inr(v.amt)+' moved to '+v.to);
    }});
};

const loanBucket=()=>state.buckets.find(b=>b.name==='Loan EMI');

/* Form sheet */
let fCfg,fArm=false;
function openForm(cfg){
  fCfg=cfg;fArm=false;
  $('fTitle').textContent=cfg.title;$('fSub').textContent=cfg.sub||'';$('fSub').hidden=!cfg.sub;
  $('fErr').textContent='';$('fOk').textContent=cfg.ok;$('fCancel').hidden=!cfg.fields.length;
  $('fDel').hidden=!cfg.onDelete;$('fDel').textContent=cfg.delLabel||'Remove';
  const box=$('fFields');box.innerHTML='';
  cfg.fields.forEach(f=>{
    const w=mk('div','fld'),id='ff_'+f.id;
    if(f.type==='toggle'){
      const lab=mk('label','tog');lab.append(mk('span',null,f.label));
      const i=mk('input');i.type='checkbox';i.id=id;i.checked=!!f.value;lab.append(i);w.append(lab);box.append(w);return;
    }
    const lab=mk(f.type==='chips'?'span':'label','flabel',f.label);
    if(f.type!=='chips')lab.htmlFor=id;
    if(f.opt)lab.append(mk('i',null,' (optional)'));
    w.append(lab);
    if(f.type==='chips'){
      const ch=mk('div','chips');ch.id=id;ch.dataset.val=f.value||'';ch.setAttribute('role','group');
      f.options.forEach(o=>{
        const b=mk('button','chip',o.t);b.type='button';b.setAttribute('aria-pressed',o.v===ch.dataset.val);
        b.onclick=()=>{const off=f.opt&&ch.dataset.val===o.v;ch.dataset.val=off?'':o.v;
          ch.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));if(!off)b.setAttribute('aria-pressed','true')};
        ch.append(b);
      });
      w.append(ch);
    }else{
      const i=mk('input');i.id=id;i.autocomplete='off';
      if(f.type==='money'){
        i.inputMode='numeric';i.placeholder='₹0';
        if(f.value!=null&&f.value!=='')i.value=Number(f.value).toLocaleString('en-IN');
        i.onblur=()=>{i.value=i.value.trim()===''?'':toNum(i.value).toLocaleString('en-IN')};
      }else if(f.type==='rate'){i.inputMode='decimal';i.placeholder='e.g. 9.5';if(f.value!=null)i.value=f.value}
      else if(f.type==='date'){i.type='date';i.value=f.value||today();i.max=today()}
      else{i.maxLength=40;i.placeholder=f.ph||'';i.value=f.value||''}
      w.append(i);
    }
    box.append(w);
  });
  $('fSheet').hidden=false;
  const first=box.querySelector('input:not([type=checkbox])');if(first)first.focus();
}
function readForm(){
  const o={};
  fCfg.fields.forEach(f=>{
    const e=$('ff_'+f.id);
    if(f.type==='chips')o[f.id]=e.dataset.val;
    else if(f.type==='toggle')o[f.id]=e.checked;
    else if(f.type==='money')o[f.id]=e.value.trim()===''?null:toNum(e.value);
    else if(f.type==='rate'){const v=parseFloat(e.value.replace(/[^\d.]/g,''));o[f.id]=isNaN(v)?null:v}
    else o[f.id]=e.value.trim();
  });
  return o;
}
$('fForm').onsubmit=e=>{e.preventDefault();const err=fCfg.onSubmit(readForm());if(err){$('fErr').textContent=err;return}$('fSheet').hidden=true};
$('fCancel').onclick=()=>$('fSheet').hidden=true;
$('fSheet').onclick=e=>{if(e.target.id==='fSheet')$('fSheet').hidden=true};
$('fDel').onclick=()=>{
  if(!fArm){fArm=true;$('fDel').textContent='Tap again to confirm';return}
  const err=fCfg.onDelete();
  if(err){$('fErr').textContent=err;fArm=false;$('fDel').textContent=fCfg.delLabel||'Remove';return}
  $('fSheet').hidden=true;
};

/* Goal pockets inside Savings */
const KEPT=['With me','Bank','RD','FD','SIP / ETF'].map(v=>({v,t:v}));
function goalIcon(n){
  if(/car|bike|tyre|tire|vehicle|scooter/i.test(n))return 'M3 13l2-6h14l2 6v5h-3v-2H6v2H3zM7 13h.01M17 13h.01';
  if(/school|fee|educat|college|study|tuition/i.test(n))return 'M2 9l10-5 10 5-10 5-10-5zM6 11v5c3 2 9 2 12 0v-5';
  if(/medic|health|doctor|hospital/i.test(n))return 'M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10zM12 9v5M9.5 11.5h5';
  if(/wedding|marriage|biya/i.test(n))return 'M4 14a5 5 0 1 0 10 0a5 5 0 1 0-10 0M10 14a5 5 0 1 0 10 0a5 5 0 1 0-10 0';
  if(/house|home|flat|land/i.test(n))return 'M3 11l9-7 9 7M5 10v10h14V10M10 20v-5h4v5';
  if(/trip|travel|tour|holiday/i.test(n))return 'M2 16l20-8-6 12-3-5-5-2z';
  return 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01';
}

function goalFields(g){return[
  {id:'name',type:'text',label:'Goal name',value:g?g.name:'',ph:'e.g. School fees, Car service, Wedding'},

function newGoal(){openForm({title:'New goal',ok:'Create goal',
  fields:[...goalFields(),{id:'start',type:'money',label:'Already saved before using this app',opt:true}],
  onSubmit:v=>{if(!v.name)return 'Give the goal a name.';
    state.goals.push({id:'g'+Date.now(),name:v.name,target:v.target||null,kept:v.kept||'',saved:v.start||0});done('Goal created')}})}
function editGoal(g){openForm({title:'Edit goal',ok:'Save',fields:goalFields(g),
  onSubmit:v=>{if(!v.name)return 'Give the goal a name.';g.name=v.name;g.target=v.target||null;g.kept=v.kept||'';done('Goal updated')},
  delLabel:'Remove this goal',
  onDelete:()=>{if(g.saved>0)return 'Use or move the money in this goal first.';state.goals=state.goals.filter(x=>x!==g);done('Goal removed')}})}
function addToGoal(g){const free=freeSav();openForm({title:'Add to '+g.name,sub:'Free in Savings: '+inr(free),ok:'Add money',
  fields:[{id:'amt',type:'money',label:'Amount'}],
  onSubmit:v=>{if(!v.amt)return 'Type an amount.';
    if(v.amt>free)return 'Only '+inr(free)+' is free in Savings. Put more into Savings when you add income.';
    savBucket().spent+=v.amt;g.saved+=v.amt;done(inr(v.amt)+' added to '+g.name)}})}
function useGoal(g){openForm({title:'Use money from '+g.name,sub:'In this goal: '+inr(g.saved),ok:'Done',
  fields:[{id:'amt',type:'money',label:'Amount'},
    {id:'how',type:'chips',label:'What happened?',options:[{v:'spent',t:'Spent it for this goal'},{v:'back',t:'Move back to Savings'}],value:'spent'}],
  onSubmit:v=>{if(!v.amt)return 'Type an amount.';if(v.amt>g.saved)return 'This goal has only '+inr(g.saved)+'.';
    g.saved-=v.amt;if(v.how==='back')savBucket().spent-=v.amt;
    done(v.how==='back'?inr(v.amt)+' moved back to Savings':inr(v.amt)+' used from '+g.name)}})}

const KINDS=['EMI','Credit card bill','Monthly interest','Other'];
const KICON={'EMI':ICONS['Loan EMI'],'Monthly interest':'M19 5L5 19M7 7h.01M17 17h.01','Credit card bill':'M3 6h18v12H3zM3 10h18M7 15h3','Other':'M5 12h.01M12 12h.01M19 12h.01'};
const paidNow=l=>l.paidCycle===state.cycId?(l.paidAmt||0):0;
const emiTotal=()=>state.loans.reduce((a,l)=>a+(isCard(l)?(nextBill(l)||l.amount||0):(l.amount||0)),0);
const loanMain=()=>{const lb=loanBucket();return lb?lb.planned-lb.spent:0};

function payLoan(l){const main=loanMain(),pd=paidNow(l);openForm({title:'Pay '+l.name,ok:'Save',
  sub:'Main balance: '+inr(main)+(pd?' · Already paid '+inr(pd):''),
  fields:[{id:'amt',type:'money',label:'Paid this cycle',value:pd||(isCard(l)?(l.billDue||null):null)||l.amount||null}],
  onSubmit:v=>{if(v.amt==null)return 'Type an amount. Type 0 to undo.';
    const diff=v.amt-pd;
    if(diff>main)return 'Only '+inr(main)+' is in the main balance. Move more money into Loan EMI first.';
    loanBucket().spent+=diff;l.paidAmt=v.amt;l.paidCycle=state.cycId;
    done(v.amt?'Paid '+inr(v.amt)+' to '+l.name:'Payment removed')}})}
function loanFields(l){return[
  {id:'name',type:'text',label:'Loan name',value:l?l.name:'',ph:'e.g. Car loan, SBI credit card'},
  {id:'kind',type:'chips',label:'What do you pay?',options:KINDS.map(k=>({v:k,t:k})),value:l?l.kind:'EMI'},
  {id:'amount',type:'money',label:'Amount each month',opt:true,value:l?l.amount:null}]}
function saveLoan(l,v){
  if(!v.name)return 'Give the loan a name.';
  const isNew=!l;l=l||{id:'l'+Date.now()};
  Object.assign(l,{name:v.name,kind:v.kind||'EMI',amount:v.amount||null});
  if(isNew)state.loans.push(l);done(isNew?'Loan added':'Loan updated');
}
function newLoan(){openForm({title:'Add loan',ok:'Add loan',fields:loanFields(),onSubmit:v=>saveLoan(null,v)})}
function editLoan(l){openForm({title:'Edit loan',ok:'Save',fields:loanFields(l),onSubmit:v=>saveLoan(l,v),
  delLabel:'Remove this loan',onDelete:()=>{state.loans=state.loans.filter(x=>x!==l);done('Loan removed')}})}

/* One bucket: what was spent from it */
function subRender(k){
  if(k==='sav')return renderSavings();if(k==='loan')return renderLoans();if(k==='cash')return renderCash();
  if(k==='me')return renderMe();
  if(k==='an')return renderAnalysis(-1);if(k&&k.startsWith('an:'))return renderAnalysis(+k.slice(3));
  if(k&&k.startsWith('b:'))return renderBucket(k.slice(2));
}
function txRow(t){
  const r=mk('div','arow'),m=mk('span','mini');
  if(t.app==='Cash')m.innerHTML=svg('M2.5 6h19v12h-19zM12 9.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6zM6 9.5v5M18 9.5v5');
  else paintIcon(m,t.bucket);
  const nm=mk('span','nm');nm.append(mk('span',null,t.name),mk('small',null,fmtDate(t.date)+' · '+payLabel(t)));
  r.append(m,nm,mk('span','amtr num','−'+inr(t.amt)));r.classList.add('tapr');r.onclick=()=>editTxn(t);return r;
}
function renderBucket(name){
  const b=state.buckets.find(x=>x.name===name);if(!b){$('subPage').hidden=true;return}
  sub='b:'+name;$('subPage').className='page';$('subTitle').textContent=name;
  const B=$('subBody');B.innerHTML='';
  const left=b.planned-b.spent;
  const hero=mk('section','hero'+(left<0?' over':''));
  hero.append(mk('span','label','Left this cycle'),mk('span','big num',left<0?'Over by '+inr(-left):inr(left)));
  const r=mk('div','row num');r.append(mk('span',null,'Planned '+inr(b.planned)),mk('span',null,'Spent '+inr(b.spent)));
  {const oc=cardIn(name);if(oc)r.append(mk('span',null,'+'+inr(oc)+' on credit card'))}
  hero.append(r);B.append(hero);
  const tx=(state.txns||[]).filter(t=>t.bucket===name),cur=tx.filter(t=>inCur(t)),old=tx.filter(t=>!inCur(t));
  const sh=mk('div','sechead');sh.append(mk('h4',null,'This cycle')); B.append(sh);
  if(!cur.length){const e=mk('div','card empty');e.append(mk('span',null,'Nothing spent from this bucket yet in this cycle.'));B.append(e)}
  else{const l=mk('div','alist');cur.forEach(t=>l.append(txRow(t)));B.append(l)}
  if(state.example){const listed=cur.reduce((a,t)=>a+t.amt,0);if(b.spent>listed)B.append(mk('p','hint num','The example figures include '+inr(b.spent-listed)+' of spending that is not listed here.'))}
  if(old.length){
    const s2=mk('div','sechead');s2.append(mk('h4',null,'Earlier cycles'));B.append(s2);
    const l=mk('div','alist');old.slice(0,20).forEach(t=>l.append(txRow(t)));B.append(l);
  }
}

/* Analysis: plain maths on your own cycles, no AI */
function cyc(i){
  if(i<0)return{cur:true,start:state.start,end:null,buckets:state.buckets,income:state.income,untracked:state.untracked||0,unassigned:state.unassigned};
  const h=state.history[i];return{cur:false,start:h.start,end:h.end,buckets:h.buckets,income:h.income,untracked:h.untracked||0,unassigned:h.unassigned||0};
}
const incomeOf=c=>c.income!=null?c.income:c.buckets.reduce((a,b)=>a+b.planned,0)+(c.unassigned||0);
const spendOf=c=>c.buckets.filter(b=>b.name!=='Savings').reduce((a,b)=>a+b.spent,0)+(c.untracked||0);
const txIn=c=>(state.txns||[]).filter(t=>t.date>=c.start&&(!c.end||t.date<c.end));
const cycLabel=c=>fmtDate(c.start)+' – '+(c.end?fmtDate(c.end):'now');
function cycleLen(){
  const h=state.history.filter(x=>x.end);if(!h.length)return 30;
  return Math.max(7,Math.round(h.reduce((a,x)=>a+(new Date(x.end)-new Date(x.start))/864e5,0)/h.length));
}
function suggestPlan(amount){
  const past=state.history.slice(-3);if(!past.length)return null;
  const plan={};let sum=0;
  state.buckets.forEach(b=>{
    if(b.name==='Savings')return;
    let v;
    if(b.name==='Loan EMI'&&emiTotal())v=emiTotal();
    else{const vals=past.map(h=>{const x=h.buckets.find(y=>y.name===b.name);return x?x.spent:null}).filter(x=>x!=null);
      v=vals.length?vals.reduce((a,x)=>a+x,0)/vals.length:b.planned}
    v=Math.round(v/100)*100;plan[b.name]=v;sum+=v;
  });
  plan.Savings=Math.max(0,amount-sum);
  return{plan,sum,short:Math.max(0,sum-amount),n:past.length};
}
function renderAnalysis(i){
  sub=i>=0?'an:'+i:'an';$('subPage').className='page';$('subTitle').textContent='Analysis';
  const B=$('subBody');B.innerHTML='';const c=cyc(i);
  if(state.history.length){
    const ch=mk('div','chips');
    [-1,...state.history.map((_,k)=>k).reverse()].slice(0,6).forEach(k=>{
      const b=mk('button','chip',k<0?'This cycle':cycLabel(cyc(k)));b.type='button';b.setAttribute('aria-pressed',k===i);
      b.onclick=()=>{renderAnalysis(k);$('subPage').scrollTop=0};ch.append(b);
    });
    B.append(ch);
  }
  if(state.example)B.append(mk('p','note','Example figures. Your own analysis appears after your first full cycle.'));
  const inc=incomeOf(c),sp=spendOf(c),kept=inc-sp;
  const hero=mk('section','hero');
  hero.append(mk('span','label',c.cur?'This cycle so far · day '+(daysSince(state.start)+1):cycLabel(c)),mk('span','big num',inr(sp)+' spent'));
  const r=mk('div','row num');
  r.append(mk('span',null,'Income '+inr(inc)),mk('span',null,kept>=0?'Not spent '+inr(kept):'Overspent '+inr(-kept)));
  if(c.untracked)r.append(mk('span',null,'Untracked cash '+inr(c.untracked)));
  {const cs=txIn(c).filter(t=>t.app==='Card').reduce((a,t)=>a+t.amt,0);if(cs)r.append(mk('span',null,'On credit card '+inr(cs)))}
  hero.append(r);B.append(hero);

  /* 1. Planned vs spent */
  const s1=mk('div','sechead');s1.append(mk('h4',null,'Planned vs spent'));B.append(s1);
  const card=mk('div','card pvlist');
  const frac=c.cur?Math.min(1,(daysSince(state.start)+1)/cycleLen()):1;
  c.buckets.filter(b=>b.name!=='Savings').forEach(b=>{
    const used=b.planned?b.spent/b.planned:(b.spent?2:0),over=b.spent>b.planned;
    const fast=c.cur&&b.name!=='Loan EMI'&&!over&&b.planned>0&&used>=.5&&used>frac+.2;
    const row=mk('div','pv'+(over?' over':fast?' warn':''));
    const t=mk('div','t');t.append(mk('span',null,b.name),mk('span','num',over?'Over by '+inr(b.spent-b.planned):inr(b.spent)+' of '+inr(b.planned)));
    const bar=mk('div','bar'),fill=mk('i');fill.style.width=Math.min(100,used*100)+'%';bar.append(fill);
    row.append(t,bar);
    if(fast)row.append(mk('small','num','Spending fast: '+Math.round(used*100)+'% used with '+Math.round(frac*100)+'% of the cycle gone'));
    card.append(row);
  });
  B.append(card);

  /* 2. Where the money went */
  const s2=mk('div','sechead');s2.append(mk('h4',null,'Where the money went'));B.append(s2);
  const groups={};txIn(c).forEach(t=>{const k=t.name||'Payment';groups[k]=groups[k]||{amt:0,n:0};groups[k].amt+=t.amt;groups[k].n++});
  const top=Object.entries(groups).sort((a,b)=>b[1].amt-a[1].amt).slice(0,5);
  if(c.untracked)top.push(['Untracked cash',{amt:c.untracked,n:0}]);
  if(!top.length)B.append(mk('div','card empty','No payments recorded in this cycle.'));
  else{const l=mk('div','alist');top.forEach(([name,g])=>{
    const row=mk('div','arow'),m=mk('span','mini',name.charAt(0).toUpperCase());
    const nm=mk('span','nm');nm.append(mk('span',null,name),mk('small',null,g.n?g.n+(g.n>1?' payments':' payment'):'Cash you could not account for'));
    row.append(m,nm,mk('span','amtr num',inr(g.amt)));l.append(row)});B.append(l)}

  /* 3. Repeat overspending */
  const fin=state.history.slice(-4);
  if(fin.length>=2){
    const s3=mk('div','sechead');s3.append(mk('h4',null,'Repeat overspending'));B.append(s3);
    const ins=mk('div','card');let any=false;
    state.buckets.filter(b=>b.name!=='Savings').forEach(b=>{
      const n=fin.filter(h=>{const x=h.buckets.find(y=>y.name===b.name);return x&&x.spent>x.planned}).length;
      if(n>=2){any=true;const d=mk('div','ins');d.append(mk('i',null),mk('span',null,b.name+' went over in '+n+' of the last '+fin.length+' cycles.'));ins.append(d)}
    });
    if(!any)ins.append(mk('span','hint','No bucket went over more than once in the last '+fin.length+' cycles.'));
    B.append(ins);
  }

  /* 4. Savings trend */
  const pts=state.history.slice(-5).map((h,k)=>({c:cyc(state.history.length-Math.min(5,state.history.length)+k)}));
  pts.push({c:cyc(-1)});
  if(pts.length>=2){
    const s4=mk('div','sechead');s4.append(mk('h4',null,'Not spent each cycle'));B.append(s4);
    const vals=pts.map(p=>incomeOf(p.c)-spendOf(p.c)),mx=Math.max(1,...vals.map(v=>Math.max(0,v)));
    const tr=mk('div','card trend');
    pts.forEach((p,k)=>{
      const v=vals[k],col=mk('div','tcol'+(p.c.cur?' cur':''));
      const bar=mk('i');bar.style.height=Math.max(3,Math.max(0,v)/mx*100)+'px';
      col.append(mk('b','num'+(v<0?' neg':''),(v<0?'−':'')+inr(Math.abs(v))),bar,mk('span',null,p.c.cur?'Now':fmtDate(p.c.start)));
      tr.append(col);
    });
    B.append(tr);
    B.append(mk('p','hint','Income minus spending. Left-over money moves to Savings when a new cycle starts.'));
  }

  /* 5. Suggested plan */
  const base=state.income!=null?state.income:incomeOf(cyc(-1));
  const s=suggestPlan(base);
  if(s){
    const s5=mk('div','sechead');s5.append(mk('h4',null,'Suggested plan for next cycle'));B.append(s5);
    const l=mk('div','alist');
    state.buckets.forEach(b=>{
      const row=mk('div','arow'+(b.name==='Savings'?' strong':'')),m=mk('span','mini');
      paintIcon(m,b.name);
      const nm=mk('span','nm');nm.append(mk('span',null,b.name),mk('small',null,b.name==='Savings'?'Whatever is left':b.name==='Loan EMI'&&emiTotal()?'Your loans\' monthly amounts':'Average of last '+s.n+(s.n>1?' cycles':' cycle')));
      row.append(m,nm,mk('span','amtr num',inr(s.plan[b.name]||0)));l.append(row);
    });
    B.append(l);
    B.append(mk('p','hint num',s.short?'This plan is '+inr(s.short)+' more than an income of '+inr(base)+'. Cut back some buckets when you add income.':'Based on an income of '+inr(base)+' and what you actually spent. Tap below to use it for this cycle now, or switch on auto-fill in Profile & settings.'));
    B.append(act('Use this plan for this cycle',()=>applyPlan(s,base),'pill-btn wide'));
  }else B.append(mk('p','hint','After your first full cycle, the app will suggest a plan for the next one based on what you actually spent.'));
}

/* Credit card, forgotten payments, edit/delete */
function isCard(l){return l&&l.kind==='Credit card bill'}
function inCur(t){return t.cyc?t.cyc===state.cycId:t.date>=state.start}
function nextBill(l){return (state.txns||[]).filter(t=>t.app==='Card'&&t.cardId===l.id&&inCur(t)).reduce((a,t)=>a+t.amt,0)}
function cardDueAll(){return state.loans.filter(isCard).reduce((a,l)=>a+nextBill(l),0)}
function cardIn(name){return (state.txns||[]).filter(t=>t.app==='Card'&&t.bucket===name&&inCur(t)).reduce((a,t)=>a+t.amt,0)}
function payLabel(t){return t.app==='Cash'?'Cash':t.app==='Card'?'Credit card':'UPI'}
function cardPay(){
  const err=payErr();if(err){$('pErr').textContent=err;return}
  const cards=state.loans.filter(isCard);
  const go=id=>{
    const c=state.loans.find(l=>l.id===id),p=newPending('Card');p.cardId=id;
    recordTxn(p);if(pay.payee)state.merchants[pay.payee.pa]=pay.bucket;
    $('payPage').hidden=true;done(inr(p.amt)+' on '+c.name+'. Added to its next bill');
  };
  if(!cards.length){const c={id:'l'+Date.now(),name:'Credit card',kind:'Credit card bill',amount:null};state.loans.push(c);go(c.id);return}
  if(cards.length===1){go(cards[0].id);return}
  openForm({title:'Which card?',ok:'Save',fields:[{id:'card',type:'chips',label:'Card',options:cards.map(c=>({v:c.id,t:c.name})),value:cards[0].id}],onSubmit:v=>{go(v.card)}});
}
function txApply(t,sign){
  if(!inCur(t))return;
  if(t.app!=='Card'){const b=state.buckets.find(x=>x.name===t.bucket);if(b)b.spent+=sign*t.amt}
  if(t.app==='Cash')state.cash-=sign*t.amt;
}
function editTxn(t){
  openForm({title:'Edit payment',ok:'Save',sub:'Paid by '+payLabel(t).toLowerCase().replace('upi','UPI'),
    fields:[{id:'amt',type:'money',label:'Amount',value:t.amt},
      {id:'name',type:'text',label:'Paid to',value:t.name},
      {id:'bucket',type:'chips',label:'Bucket',options:state.buckets.filter(b=>b.name!=='Savings').map(b=>({v:b.name,t:b.name})),value:t.bucket},
      {id:'date',type:'date',label:'Date',value:t.date}],
    onSubmit:v=>{
      if(!v.amt)return 'Type an amount.';if(!v.bucket)return 'Choose a bucket.';if(!v.date)return 'Choose a date.';
      txApply(t,-1);Object.assign(t,{amt:v.amt,name:v.name||t.name,bucket:v.bucket,date:v.date});txApply(t,1);
      state.txns.sort((a,b)=>b.date.localeCompare(a.date));done('Payment updated');
    },
    delLabel:'Delete this payment',
    onDelete:()=>{txApply(t,-1);state.txns=state.txns.filter(x=>x!==t);done('Payment deleted')}});
}

const NUMRE=/₹[\d,]+(?:\.\d+)?|\d[\d,]*(?:\.\d+)?/g;
function trAs(raw){
  const lead=raw.match(/^\s*/)[0],tail=raw.match(/\s*$/)[0],s=raw.trim();if(!s)return raw;
  const toks=[];const key=s.replace(NUMRE,m=>{toks.push(m);return '#'});
  let out=AS_EXACT[key];
  if(out!=null){let k=0;out=out.replace(/#/g,()=>toks[k++]??'');return lead+out+tail}
  for(const [re,rp] of AS_RE)if(re.test(s))return lead+s.replace(re,rp)+tail;
  return raw;
}
function trNode(root){
  if(state.lang!=='as')return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){if(n.parentElement&&n.parentElement.closest('script,style,.ms'))continue;const t=trAs(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t}
  if(root.querySelectorAll)root.querySelectorAll('input[placeholder]').forEach(i=>{const t=trAs(i.placeholder);if(t!==i.placeholder)i.placeholder=t});
}
function i18nInit(){
  if(state.lang!=='as')return;
  document.documentElement.lang='as';
  const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap';document.head.append(l);
  document.documentElement.classList.add('lang-as');
  trNode(document.body);
  new MutationObserver(ms=>{for(const m of ms){
    if(m.type==='characterData'){const t=trAs(m.target.nodeValue);if(t!==m.target.nodeValue)m.target.nodeValue=t}
    else m.addedNodes.forEach(n=>{if(n.nodeType===3){const t=trAs(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t}else if(n.nodeType===1)trNode(n)})
  }}).observe(document.body,{childList:true,subtree:true,characterData:true});
}

/* ===== App lock (4-digit PIN) ===== */
function hashPin(p){let h=0x811c9dc5;const s='mb-pin:'+p;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16)}
let lk={mode:null,val:'',first:'',then:null},hiddenAt=0;
function lockMsg(t,bad){const m=$('lockMsg');m.textContent=t||'';m.className='lmsg'+(bad?' bad':'');}
function showLock(mode,then){
  lk={mode,val:'',first:'',then:then||null};
  $('lockTitle').textContent=mode==='unlock'?'Enter your PIN':mode==='set1'?'Set a 4-digit PIN':mode==='set2'?'Enter the PIN again':'Enter your current PIN';
  $('lockCancel').hidden=mode==='unlock';$('lockForgot').hidden=mode!=='unlock';$('lockReset').hidden=true;
  lockMsg('');drawDots();$('lock').hidden=false;
}
function drawDots(){document.querySelectorAll('#lockDots i').forEach((d,k)=>d.classList.toggle('on',k<lk.val.length))}
function lockKey(k){
  if(k==='del'){lk.val=lk.val.slice(0,-1);drawDots();return}
  if(lk.val.length>=4)return;lk.val+=k;drawDots();
  if(lk.val.length<4)return;
  const v=lk.val;setTimeout(()=>{
    if(lk.mode==='unlock'||lk.mode==='verify'){
      if(hashPin(v)===state.pin){$('lock').hidden=true;const t=lk.then;lk.then=null;if(t)t()}
      else{lk.val='';drawDots();lockMsg('Wrong PIN. Try again.',true);shake()}
    }else if(lk.mode==='set1'){lk.first=v;lk.val='';lk.mode='set2';$('lockTitle').textContent='Enter the PIN again';drawDots();lockMsg('')}
    else if(lk.mode==='set2'){
      if(v===lk.first){state.pin=hashPin(v);$('lock').hidden=true;done('App lock switched on')}
      else{lk.mode='set1';lk.val='';lk.first='';$('lockTitle').textContent='Set a 4-digit PIN';drawDots();lockMsg('The PINs did not match. Try again.',true);shake()}
    }
  },120);
}
function shake(){const d=$('lockDots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');try{navigator.vibrate&&navigator.vibrate([30,40,30])}catch(e){}}
document.querySelectorAll('#lockPad button[data-k]').forEach(b=>b.onclick=()=>lockKey(b.dataset.k));
$('lockCancel').onclick=()=>{$('lock').hidden=true};
$('lockForgot').onclick=()=>{lockMsg('If you forgot your PIN, the only way in is to clear all data on this phone. This cannot be undone.');$('lockReset').hidden=false};

};

  const cc=mk('button','app');cc.type='button';const cci=mk('span','ac card');cci.innerHTML=svg('M3 6h18v12H3zM3 10h18M7 15h3');
  cc.append(cci,mk('span',null,'Credit card'));cc.onclick=cardPay;box.append(cc);
  $('pHow').textContent=filled
    ?'Your UPI app opens with '+inr(pay.amt)+' to '+(p.pn||p.pa)+' filled in. Pay there, then come back here and tap Yes.'
    :'Your UPI app opens. Scan the QR code there and pay, then come back here and tap Yes.';
}
function parseUpi(t){
  t=String(t||'').trim();if(!/^upi:\/\/pay/i.test(t))return null;
  const q=t.split('?')[1]||'',sp=new URLSearchParams(q),pa=sp.get('pa');
  if(!pa||!pa.includes('@'))return null;
  const am=sp.get('am'),mc=sp.get('mc');
  return{raw:q,pa,pn:sp.get('pn')||'',am:am&&Number(am)>0?Number(am):null,merchant:!!((mc&&mc!=='0000')||sp.get('sign'))};
}
async function decodeFile(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    if('BarcodeDetector' in window){try{const d=new BarcodeDetector({formats:['qr_code']});const r=await d.detect(img);if(r.length)return r[0].rawValue}catch(e){}}
    if(typeof jsQR!=='function')return null;
    for(const max of [1000,1600,600]){
      const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
      const d=x.getImageData(0,0,c.width,c.height),r=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
      if(r)return r.data;
    }
    return null;
  }finally{URL.revokeObjectURL(url)}
}
$('qrCam').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  $('pErr').textContent='Reading the QR code…';
  let txt=null;try{txt=await decodeFile(f)}catch(err){}
  if(!txt){$('pErr').textContent="Couldn't find a QR code in that photo. Hold the phone steady, fill the screen with the QR code and try again.";return}
  const p=parseUpi(txt);
  if(!p){$('pErr').textContent='This QR code is not a UPI payment code.';return}
  $('pErr').textContent='';pay.payee=p;
  if(p.am){pay.amt=p.am;$('pAmt').value='₹'+p.am.toLocaleString('en-IN')}
  if(p.pn&&!$('pTo').value.trim())$('pTo').value=p.pn;
  if(!pay.bucket&&state.merchants[p.pa])pay.bucket=state.merchants[p.pa];
  renderPay();
};
function newPending(app){
  const p=pay.payee;
  return{id:'t'+Date.now(),amt:pay.amt,bucket:pay.bucket,name:$('pTo').value.trim()||(p&&(p.pn||p.pa))||'UPI payment',pa:p?p.pa:'',note:'',app,date:$('pDate').value||today()};
}
function startPending(app){
  state.pending=newPending(app);if(pay.payee)state.merchants[pay.payee.pa]=pay.bucket;save();
  clearTimeout(askTimer);askTimer=setTimeout(()=>{$('payPage').hidden=true;render();askConfirm()},4000);
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&state.pending){clearTimeout(askTimer);askTimer=setTimeout(()=>{$('payPage').hidden=true;render();askConfirm()},700)}
});
function askConfirm(){
  const p=state.pending;if(!p)return;
  $('cTitle').textContent='Did your payment of '+inr(p.amt)+' go through?';
  $('cSub').textContent=(p.name!=='UPI payment'?'To '+p.name+'. ':'')+'Check your payment app. If it says successful, tap Yes and '+inr(p.amt)+' will come off '+p.bucket+'.';
  $('cSheet').hidden=false;
}
function recordTxn(p){
  const b=state.buckets.find(x=>x.name===p.bucket);if(b&&p.app!=='Card')b.spent+=p.amt;
  state.txns.unshift({id:p.id,date:p.date||today(),amt:p.amt,bucket:p.bucket,name:p.name,pa:p.pa,note:p.note,app:p.app,cardId:p.cardId,cyc:state.cycId});
  state.txns.sort((a,b)=>b.date.localeCompare(a.date));
  state.txns=state.txns.slice(0,300);
}
$('cYes').onclick=()=>{const p=state.pending;state.pending=null;$('cSheet').hidden=true;if(p){recordTxn(p);done(inr(p.amt)+' taken from '+p.bucket)}};
$('cNo').onclick=()=>{state.pending=null;$('cSheet').hidden=true;done('Nothing deducted')};
$('cWait').onclick=()=>{$('cSheet').hidden=true;render()};
$('pendBar').onclick=askConfirm;
$('paidOther').onclick=()=>{
  const err=payErr();if(err){$('pErr').textContent=err;return}
  const p=newPending('Other');if(pay.payee)state.merchants[pay.payee.pa]=pay.bucket;
  recordTxn(p);$('payPage').hidden=true;done(inr(p.amt)+' taken from '+p.bucket);
};
function renderExtras(){
  $('cashBar').hidden=true;$('meDot').hidden=!cashDue();
  const nm0=(state.name||'').trim();$('meInit').innerHTML=nm0?'':svg('M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0');if(nm0)$('meInit').textContent=nm0.charAt(0).toUpperCase();
  $('hello').textContent='Namaste, '+(nm0?nm0.split(' ')[0]:'User')+' 👋';
  const pb=$('pendBar'),p=state.pending;pb.hidden=!p;
  if(p)pb.querySelector('span').textContent='Waiting: '+inr(p.amt)+' to '+p.name+' from '+p.bucket;
  const rl=$('recentList'),tx=state.txns||[];$('recent').hidden=!tx.length;rl.innerHTML='';
  tx.slice(0,6).forEach(t=>{
    const r=mk('div','arow'),m=mk('span','mini');
    paintIcon(m,t.bucket);
    const nm=mk('span','nm'),sm=mk('small');sm.append(document.createTextNode(fmtDate(t.date)+' · '),mk('em','bk',t.bucket));nm.append(mk('span',null,t.name),sm);
    const am=mk('span','amtc');am.append(mk('b','amtr num','−'+inr(t.amt)),mk('small',null,payLabel(t)));
    r.append(m,nm,am);r.classList.add('tapr');r.onclick=()=>editTxn(t);rl.append(r);
  });
}
$('payBtn').onclick=openPay;
$('homeTab').onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.hidden=true);sub=null;window.scrollTo({top:0,behavior:'smooth'})};
$('anTab').onclick=()=>openSub('an');

$('resetBtn').onclick=()=>openForm({title:'Clear saved data',ok:'Clear',
  sub:'Payments only: removes all payments and gives the money back to the buckets. Everything: deletes all buckets, payments, goals and loans on this phone. This cannot be undone.',
  fields:[{id:'what',type:'chips',label:'What do you want to clear?',options:[{v:'pay',t:'Payments only'},{v:'all',t:'Everything'}],value:'pay'}],
  onSubmit:v=>{
    if(v.what==='all'){
      const fresh={start:today(),cycId:'c'+Date.now(),cash:0,example:false,unassigned:0,untracked:0,history:[],txns:[],goals:[],loans:[],merchants:{},pending:null,cashLog:[],
        buckets:defaults.map(b=>({name:b.name,planned:0,spent:0}))};
      try{localStorage.setItem(KEY,JSON.stringify(fresh))}catch(e){}
      location.reload();return;
    }
    state.txns.forEach(t=>{if(t.date>=state.start){const b=state.buckets.find(x=>x.name===t.bucket);if(b)b.spent=Math.max(0,b.spent-t.amt)}});
    state.txns=[];state.pending=null;state.merchants={};
    done('Payments cleared and buckets restored');
  }});
if(state.pending&&!state.pin)setTimeout(askConfirm,600);
if(state.pin)showLock('unlock',()=>{if(state.pending)askConfirm()});

/* Install as an app */
let deferredPrompt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const iosSafari=()=>isIOS&&/Safari/.test(navigator.userAgent)&&!/CriOS|FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent);
function instDismissed(){try{return localStorage.getItem('mb.instX')==='1'}catch(e){return false}}
function canInstall(){return !standalone()&&(!!deferredPrompt||isIOS)}
function showInst(){
  $('instBar').hidden=!canInstall()||instDismissed();
  $('instTxt').textContent=deferredPrompt?'Use it like a real app, even offline':'Add it to your Home Screen';
  $('instGo').textContent=deferredPrompt?'Install':'How';
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInst();refreshSub()});
addEventListener('appinstalled',()=>{deferredPrompt=null;showInst();toast('Installed. Open it from your home screen')});
function installApp(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;showInst()});return}
  openForm({title:'Add to Home Screen',ok:'Got it',
    sub:iosSafari()?'1. Tap the Share button at the bottom of Safari (the square with an arrow).\n2. Scroll down and tap "Add to Home Screen".\n3. Tap Add.\n\nMoney Buckets then opens like an app from its own icon.'
      :isIOS?'Open this page in Safari first, then tap the Share button and choose "Add to Home Screen".'
      :'Open your browser menu (⋮) and tap "Install app" or "Add to Home screen".',
    fields:[],onSubmit:()=>{}});
}
$('instGo').onclick=installApp;
$('instX').onclick=()=>{try{localStorage.setItem('mb.instX','1')}catch(e){};$('instBar').hidden=true};
showInst();

render();
i18nInit();
</script>
