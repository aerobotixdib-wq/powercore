<style>

<body>
<div class="wrap">
  <header>
    <h1>Money Buckets</h1>
    <div class="hright"><span class="cycle num" id="cycle"></span><button type="button" class="hbtn" id="resetBtn" aria-label="Clear saved data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>
  </header>
  <button class="pendbar" id="pendBar" type="button" hidden><i class="dot"></i><span></span><b>Confirm</b></button>

  <section class="summary" aria-label="This cycle">
    <span class="label">Left this cycle</span>
    <span class="big num" id="leftAll"></span>
    <span class="of num" id="ofAll"></span>
    <div class="bar"><i id="barAll"></i></div>
    <div class="row num"><span id="cash"></span><span id="unas"></span><span id="spentAll"></span></div>
  </section>

  <div class="sechead bhead"><h2>Buckets</h2><button class="pill-btn sm" id="moveBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>Move money</button></div>
  <p class="hint">Tap <b>Savings</b> for your goal pockets and <b>Loan EMI</b> for your loans.</p>
  <div class="grid" id="grid"></div>
  <section class="recent" id="recent" hidden>
    <div class="sechead"><h4>Recent payments</h4></div>
    <div class="alist" id="recentList"></div>
  </section>
</div>

<nav class="actions" aria-label="Actions">

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const KEY='moneyBuckets.v1';
const defaults=[
  ['Grocery',8000,5200],['Payments to people',5000,3000],['Loan EMI',9500,9500],
  ['Eating out / Online food',3000,2850],['Bills & Recharge',2500,1400],['Online shopping',2000,2350],
  ['Travel',2000,600],['Misc',1500,700],['Savings',6500,0]
].map(([name,planned,spent])=>({name,planned,spent}));
let state={start:'2026-11-07',cash:1200,buckets:defaults,unassigned:0,example:true,history:[]};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.buckets))state=s;}catch(e){}
if(state.example===undefined)state.example=true;
state.unassigned=state.unassigned||0;state.history=state.history||[];
state.merchants=state.merchants||{};state.pending=state.pending||null;
if(!state.txns)state.txns=state.example?[
  {id:'tx3',date:'2026-11-18',amt:640,bucket:'Grocery',name:'Das Grocery',ex:true},
  {id:'tx2',date:'2026-11-17',amt:420,bucket:'Eating out / Online food',name:'Zomato',ex:true},
  {id:'tx1',date:'2026-11-15',amt:349,bucket:'Bills & Recharge',name:'Jio recharge',ex:true}]:[];
if(!state.goals)state.goals=state.example?[
  {id:'g1',name:'School fees',target:15000,saved:9000,kept:'With me',ex:true},
  {id:'g2',name:'Car tyres & service',target:24000,saved:6000,kept:'RD',ex:true},
  {id:'g3',name:'Medical',target:null,saved:4500,kept:'Bank',ex:true},
  {id:'g4',name:'Wedding',target:null,saved:30000,kept:'SIP / ETF',ex:true}]:[];
if(!state.loans)state.loans=state.example?[
  {id:'l1',name:'Car loan',type:'emi',emi:9500,balance:412000,rate:9.1,updated:'2026-11-05',fromSalary:false,paidCycle:'2026-11-07',paidAmt:9500,ex:true},
  {id:'l2',name:'Credit card',type:'card',emi:null,balance:6800,rate:42,updated:'2026-11-12',fromSalary:false,ex:true},
  {id:'l3',name:'Home loan',type:'emi',emi:21000,balance:1850000,rate:8.5,updated:'2026-10-30',fromSalary:true,ex:true}]:[];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const toNum=v=>Number(String(v).replace(/[^\d]/g,''))||0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const $=id=>document.getElementById(id);
const svg=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const ICONS={
  'Grocery':'M3 9h18l-2 10a2 2 0 0 1-2 1.6H7A2 2 0 0 1 5 19L3 9zM8 9l4-5 4 5M9 13v4M15 13v4',
  'Payments to people':'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
  'Loan EMI':'M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18',
  'Eating out / Online food':'M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1-3 4-3 7h3',
  'Bills & Recharge':'M13 2L4 14h7l-1 8 9-12h-7l1-8z',
  'Online shopping':'M5 8h14l-1 13H6L5 8zM9 8V6a3 3 0 0 1 6 0v2',
  'Travel':'M6 17V6a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v11zM6 12h12M8 21v-4M16 21v-4M9 15h.01M15 15h.01',
  'Misc':'M5 12h.01M12 12h.01M19 12h.01',
  'Savings':'M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4zM9 12l2 2 4-4'
};

function render(){
  const planned=state.buckets.reduce((a,b)=>a+b.planned,0);
  const spent=state.buckets.reduce((a,b)=>a+b.spent,0);
  const day=Math.max(1,Math.floor((Date.now()-new Date(state.start+'T00:00'))/864e5)+1);
  const total=planned+state.unassigned;
  $('exNote').hidden=!state.example;
  $('cycle').textContent='Day '+day+' of cycle';
  $('leftAll').textContent=inr(total-spent);
  $('ofAll').textContent='of '+inr(total)+' this cycle';
  $('barAll').style.width=(total?Math.max(0,100*(total-spent)/total):0)+'%';
  $('cash').textContent='Cash in hand '+inr(state.cash);
  $('unas').textContent=state.unassigned>0?'Unassigned '+inr(state.unassigned):'';
  const sb=state.buckets.find(x=>x.name==='Savings');
  $('spentAll').textContent='Spent '+inr(spent-(sb?sb.spent:0));
  const g=$('grid');g.innerHTML='';
  state.buckets.forEach(b=>{
    const left=b.planned-b.spent, used=b.planned?b.spent/b.planned:0;
    const sv=b.name==='Savings',ln=b.name==='Loan EMI';
    const el=document.createElement('article');
    el.className='b'+(sv?'':left<0?' over':used>=.85?' warn':'')+(sv||ln?' tap':'');
    el.innerHTML=`<div class="ring"><span class="ic"></span></div><span class="left num"></span><span class="name"></span>`;
    el.querySelector('.ring').style.setProperty('--p',sv?0:Math.min(100,used*100));
    if(sv||ln){
      const bd=document.createElement('span');bd.className='badge';bd.innerHTML=svg('M9 6l6 6-6 6');el.querySelector('.ring').appendChild(bd);
      el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','Open '+(sv?'savings goals':'loans'));
      el.onclick=()=>openSub(sv?'sav':'loan');
      el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSub(sv?'sav':'loan')}};
    }
    const ic=el.querySelector('.ic');
    if(ICONS[b.name])ic.innerHTML=svg(ICONS[b.name]);else ic.textContent=b.name.charAt(0).toUpperCase();
    el.querySelector('.left').textContent=left<0?'Over '+inr(-left):inr(left);
    el.querySelector('.name').textContent=b.name;
    el.title=b.planned?inr(b.spent)+' spent of '+inr(b.planned):'Not planned yet';
    g.appendChild(el);
  });
  const add=document.createElement('button');add.className='b add';
  add.innerHTML=`<div class="ring"><span class="ic">${svg('M12 5v14M5 12h14')}</span></div><span class="left">&nbsp;</span><span class="name">Add bucket</span>`;
  add.onclick=openSheet;g.appendChild(add);
  renderExtras();
}
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function openSheet(){$('err').textContent='';$('bName').value='';$('sheet').hidden=false;$('bName').focus()}
$('cancel').onclick=()=>$('sheet').hidden=true;
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').hidden=true};
$('addForm').onsubmit=e=>{
  e.preventDefault();const n=$('bName').value.trim();
  if(!n){$('err').textContent='Type a name for the bucket.';return}
  if(state.buckets.some(b=>b.name.toLowerCase()===n.toLowerCase())){$('err').textContent='A bucket with this name already exists.';return}
  state.buckets.splice(state.buckets.length-1,0,{name:n,planned:0,spent:0});
  save();render();$('sheet').hidden=true;toast('Bucket added');
};
['cashBtn'].forEach(id=>$(id).onclick=()=>toast('This comes in the next step'));

/* Add income */
let inc;
const isSav=b=>b.name==='Savings';
function carryAmount(){
  if(state.example)return 0;
  return Math.max(0,state.unassigned+state.buckets.filter(b=>!isSav(b)).reduce((a,b)=>a+b.planned-b.spent,0));
}
function setType(t){inc.type=t;$('optNew').setAttribute('aria-pressed',t==='new');$('optExtra').setAttribute('aria-pressed',t==='extra')}
function openIncome(){
  inc={type:'new',amount:0,alloc:{},step:1};setType('new');
  $('incAmt').value='';$('incErr').textContent='';
  $('step1').hidden=false;$('step2').hidden=true;
  $('incTitle').textContent='Add income';$('incNext').textContent='Next';$('incNext').disabled=false;$('counter').innerHTML='';
  $('incPage').hidden=false;$('incAmt').focus();
}
function closeIncome(){$('incPage').hidden=true}
function updateCounter(){
  const used=Object.values(inc.alloc).reduce((a,v)=>a+v,0),left=inc.amount-used,c=$('counter');
  c.className='counter num'+(left<0?' over':left===0?' done':'');
  c.innerHTML=left<0?'Over by <b>'+inr(-left)+'</b>':left===0?'All assigned <b>₹0 left</b>':'Left to assign <b>'+inr(left)+'</b>';
  $('incNext').disabled=left<0;
}
function renderAlloc(){
  const l=$('alist');l.innerHTML='';
  state.buckets.forEach((b,i)=>{
    const r=document.createElement('div');r.className='arow';
    r.innerHTML=`<span class="mini"></span><span class="nm"><span></span><small></small></span><input inputmode="numeric" placeholder="₹0" autocomplete="off">`;
    const m=r.querySelector('.mini');if(ICONS[b.name])m.innerHTML=svg(ICONS[b.name]);else m.textContent=b.name.charAt(0).toUpperCase();
    r.querySelector('.nm span').textContent=b.name;
    let sm=inc.type==='extra'?'Now '+inr(b.planned-b.spent)+' left':(state.example?'':'Last cycle '+inr(b.planned));
    if(b.name==='Loan EMI'&&emiTotal())sm=(sm?sm+' · ':'')+'Your EMIs '+inr(emiTotal());
    r.querySelector('small').textContent=sm;
    const input=r.querySelector('input');input.id='alloc'+i;input.setAttribute('aria-label',b.name+' amount');
    if(inc.alloc[b.name])input.value=inc.alloc[b.name].toLocaleString('en-IN');
    input.oninput=()=>{inc.alloc[b.name]=toNum(input.value);updateCounter()};
    input.onblur=()=>{const v=toNum(input.value);input.value=v?v.toLocaleString('en-IN'):''};
    l.appendChild(r);
  });
  updateCounter();
}
$('optNew').onclick=()=>setType('new');
$('optExtra').onclick=()=>setType('extra');
$('incAmt').onblur=()=>{const v=toNum($('incAmt').value);$('incAmt').value=v?'₹'+v.toLocaleString('en-IN'):''};
$('incBack').onclick=()=>{if(inc.step===2){inc.step=1;$('step1').hidden=false;$('step2').hidden=true;$('incNext').textContent='Next';$('incNext').disabled=false;$('counter').innerHTML='';$('incTitle').textContent='Add income'}else closeIncome()};
$('useLast').onclick=()=>{state.buckets.forEach(b=>{inc.alloc[b.name]=b.planned});renderAlloc();toast('Filled from last cycle. Change any amount.')};
$('incNext').onclick=()=>{
  if(inc.step===1){
    inc.amount=toNum($('incAmt').value);
    if(!inc.amount){$('incErr').textContent='Type the amount you received.';return}
    inc.step=2;inc.alloc={};
    $('step1').hidden=true;$('step2').hidden=false;
    $('incTitle').textContent=(inc.type==='new'?'Plan ':'Add ')+inr(inc.amount);
    const carry=carryAmount();
    $('incInfo').textContent=inc.type==='new'
      ?'Fill how much goes into each bucket this cycle.'+(carry?' '+inr(carry)+' left over from the current cycle will move to Savings.':'')
      :'Add this extra money to any buckets. Anything you leave stays unassigned.';
    $('useLast').hidden=inc.type!=='new';
    $('incNext').textContent='Save';
    renderAlloc();return;
  }
  const used=Object.values(inc.alloc).reduce((a,v)=>a+v,0),left=inc.amount-used;
  if(left<0)return;
  if(inc.type==='new'){
    const carry=carryAmount();
    const sav=state.buckets.find(isSav),savLeft=(!state.example&&sav)?Math.max(0,sav.planned-sav.spent):0;
    if(!state.example)state.history.push({start:state.start,end:today(),buckets:state.buckets.map(b=>({...b})),unassigned:state.unassigned});
    state.buckets=state.buckets.map(b=>({name:b.name,planned:(inc.alloc[b.name]||0)+(isSav(b)?savLeft+carry:0),spent:0}));
    if(state.example){state.goals=state.goals.filter(g=>!g.ex);state.loans=state.loans.filter(l=>!l.ex);state.txns=state.txns.filter(t=>!t.ex)}
    state.start=today();state.unassigned=left;state.example=false;
    save();render();closeIncome();toast(carry?'New cycle started. '+inr(carry)+' moved to Savings':'New cycle started');
  }else{
    state.buckets.forEach(b=>{b.planned+=inc.alloc[b.name]||0});
    state.unassigned+=left;
    save();render();closeIncome();toast('Extra income added');
  }
};
$('incomeBtn').onclick=openIncome;

/* Move money between buckets */
$('moveBtn').onclick=()=>{
  const opts=state.buckets.map(b=>({v:b.name,t:b.name+' · '+inr(b.planned-b.spent)}));
  const from=state.unassigned>0?[{v:'__u',t:'Unassigned · '+inr(state.unassigned)},...opts]:opts;
  openForm({title:'Move money',sub:'This only changes your plan. Nothing is counted as spent.',ok:'Move',
    fields:[{id:'amt',type:'money',label:'Amount'},
      {id:'from',type:'chips',label:'From',options:from},
      {id:'to',type:'chips',label:'To',options:state.buckets.map(b=>({v:b.name,t:b.name}))}],
    onSubmit:v=>{
      if(!v.amt)return 'Type an amount.';
      if(!v.from)return 'Choose the bucket to move from.';
      if(!v.to)return 'Choose the bucket to move to.';
      if(v.from===v.to)return 'Choose two different buckets.';
      const src=v.from==='__u'?null:state.buckets.find(b=>b.name===v.from),dst=state.buckets.find(b=>b.name===v.to);
      const avail=src?src.planned-src.spent:state.unassigned;
      if(v.amt>avail)return (src?v.from:'Unassigned')+' has only '+inr(Math.max(0,avail))+' left.';
      if(src)src.planned-=v.amt;else state.unassigned-=v.amt;
      dst.planned+=v.amt;
      done(inr(v.amt)+' moved to '+v.to);
    }});
};

/* Shared helpers for pockets */
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const act=(t,fn,cls)=>{const b=mk('button',cls||'',t);b.type='button';b.onclick=fn;return b};
const fmtDate=s=>new Date(s+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const savBucket=()=>state.buckets.find(b=>b.name==='Savings');
const loanBucket=()=>state.buckets.find(b=>b.name==='Loan EMI');
const freeSav=()=>{const s=savBucket();return s?s.planned-s.spent:0};
let sub=null;
function done(msg){save();render();refreshSub();if(msg)toast(msg)}
function openSub(k){k==='sav'?renderSavings():renderLoans();$('subPage').hidden=false;$('subPage').scrollTop=0}
function refreshSub(){if($('subPage').hidden)return;sub==='sav'?renderSavings():renderLoans()}
$('subBack').onclick=()=>{$('subPage').hidden=true;sub=null};

/* Form sheet */
let fCfg,fArm=false;
function openForm(cfg){
  fCfg=cfg;fArm=false;
  $('fTitle').textContent=cfg.title;$('fSub').textContent=cfg.sub||'';$('fSub').hidden=!cfg.sub;
  $('fErr').textContent='';$('fOk').textContent=cfg.ok;
  $('fDel').hidden=!cfg.onDelete;$('fDel').textContent=cfg.delLabel||'Remove';
  const box=$('fFields');box.innerHTML='';
  cfg.fields.forEach(f=>{
    const w=mk('div','fld'),id='ff_'+f.id;
    if(f.type==='toggle'){
      const lab=mk('label','tog');lab.append(mk('span',null,f.label));
      const i=mk('input');i.type='checkbox';i.id=id;i.checked=!!f.value;lab.append(i);w.append(lab);box.append(w);return;
    }
    const lab=mk(f.type==='chips'?'span':'label','flabel',f.label);
    if(f.type!=='chips')lab.htmlFor=id;
    if(f.opt)lab.append(mk('i',null,' (optional)'));

function parseUpi(t){
  t=String(t||'').trim();if(!/^upi:\/\/pay/i.test(t))return null;
  const q=t.split('?')[1]||'',sp=new URLSearchParams(q),pa=sp.get('pa');

async function decodeFile(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    if('BarcodeDetector' in window){try{const d=new BarcodeDetector({formats:['qr_code']});const r=await d.detect(img);if(r.length)return r[0].rawValue}catch(e){}}
    if(typeof jsQR!=='function')return null;
    for(const max of [1000,1600,600]){
      const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
      const d=x.getImageData(0,0,c.width,c.height),r=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
      if(r)return r.data;
    }
    return null;
  }finally{URL.revokeObjectURL(url)}
}
$('qrCam').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  $('pErr').textContent='Reading the QR code…';

  if(!txt){$('pErr').textContent="Couldn't find a QR code in that photo. Hold the phone steady, fill the screen with the QR code and try again.";return}
  const p=parseUpi(txt);
  if(!p){$('pErr').textContent='This QR code is not a UPI payment code.';return}
  $('pErr').textContent='';pay.payee=p;
  if(p.am){pay.amt=p.am;$('pAmt').value='₹'+p.am.toLocaleString('en-IN')}
  if(p.pn&&!$('pTo').value.trim())$('pTo').value=p.pn;
  if(!pay.bucket&&state.merchants[p.pa])pay.bucket=state.merchants[p.pa];
  renderPay();
};

function askConfirm(){
  const p=state.pending;if(!p)return;
  $('cTitle').textContent='Did your payment of '+inr(p.amt)+' go through?';
  $('cSub').textContent=(p.name!=='UPI payment'?'To '+p.name+'. ':'')+'Check your payment app. If it says successful, tap Yes and '+inr(p.amt)+' will come off '+p.bucket+'.';
  $('cSheet').hidden=false;
}
function recordTxn(p){
  const b=state.buckets.find(x=>x.name===p.bucket);if(b)b.spent+=p.amt;
  state.txns.unshift({id:p.id,date:today(),amt:p.amt,bucket:p.bucket,name:p.name,pa:p.pa,note:p.note,app:p.app});
  state.txns=state.txns.slice(0,300);
}
$('cYes').onclick=()=>{const p=state.pending;state.pending=null;$('cSheet').hidden=true;if(p){recordTxn(p);done(inr(p.amt)+' taken from '+p.bucket)}};
$('cNo').onclick=()=>{state.pending=null;$('cSheet').hidden=true;done('Nothing deducted')};
$('cWait').onclick=()=>{$('cSheet').hidden=true;render()};
$('pendBar').onclick=askConfirm;
$('paidOther').onclick=()=>{
  const err=payErr();if(err){$('pErr').textContent=err;return}
  const p=newPending('Other');if(pay.payee)state.merchants[pay.payee.pa]=pay.bucket;
  recordTxn(p);$('payPage').hidden=true;done(inr(p.amt)+' taken from '+p.bucket);
};
function renderExtras(){
  const pb=$('pendBar'),p=state.pending;pb.hidden=!p;
  if(p)pb.querySelector('span').textContent='Waiting: '+inr(p.amt)+' to '+p.name+' from '+p.bucket;
  const rl=$('recentList'),tx=state.txns||[];$('recent').hidden=!tx.length;rl.innerHTML='';
  tx.slice(0,6).forEach(t=>{
    const r=mk('div','arow'),m=mk('span','mini');
    if(ICONS[t.bucket])m.innerHTML=svg(ICONS[t.bucket]);else m.textContent=t.bucket.charAt(0).toUpperCase();
    const nm=mk('span','nm');nm.append(mk('span',null,t.name),mk('small',null,t.bucket+' · '+fmtDate(t.date)+(t.note?' · '+t.note:'')));
    r.append(m,nm,mk('span','amtr num','−'+inr(t.amt)));rl.append(r);
  });
}
$('payBtn').onclick=openPay;
$('resetBtn').onclick=()=>openForm({title:'Clear saved data',ok:'Clear',
  sub:'Payments only: removes all payments and gives the money back to the buckets. Everything: deletes all buckets, payments, goals and loans on this phone. This cannot be undone.',
  fields:[{id:'what',type:'chips',label:'What do you want to clear?',options:[{v:'pay',t:'Payments only'},{v:'all',t:'Everything'}],value:'pay'}],
  onSubmit:v=>{
    if(v.what==='all'){try{localStorage.removeItem(KEY)}catch(e){}location.reload();return}
    state.txns.forEach(t=>{if(t.date>=state.start){const b=state.buckets.find(x=>x.name===t.bucket);if(b)b.spent=Math.max(0,b.spent-t.amt)}});
    state.txns=[];state.pending=null;state.merchants={};
    done('Payments cleared and buckets restored');
  }});
if(state.pending)setTimeout(askConfirm,600);
render();
</script>
</body>
</html>
