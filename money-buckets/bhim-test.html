<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BHIM Link Test</title>
<style>
:root{--bg:#F3F6F4;--ink:#15211C;--muted:#5E6D66;--accent:#0E6B5C;--soft:#DDEFEA}

h1{font-size:22px;margin:0}p{color:var(--muted);margin:0 0 6px}
